<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norden Design System</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: Storybook-style docs shell. Left nav, main column with a live canvas, a controls panel and generated code per component. */
:root{
  /* shell tokens (themed) */
  --bg:#f9f9f9; --panel:#ffffff; --fg:#292929; --muted:#6d6d6d; --line:#e6e6e6; --accent:#0265dc; --accent-soft:#e2f4ff; --code-bg:#f5f5f5; --stage:#f5f5f5;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Roboto Mono',ui-monospace,Menlo,monospace;

  /* Norden tokens, taken from the Figma file (components stay light, like the source file) */
  --n-neutral-25:#29292929; --n-neutral-100:#ffffff; --n-neutral-200:#f5f5f5; --n-neutral-300:#e6e6e6; --n-neutral-400:#b1b1b1;
  --n-neutral-600:#909090; --n-neutral-700:#6d6d6d; --n-neutral-800:#535353; --n-neutral-900:#292929; --n-neutral-1000:#1c1c1c; --n-neutral-1100:#0d0d0d;
  --n-blue-100:#e2f4ff; --n-blue-200:#cae8ff; --n-blue-400:#96cefd; --n-blue-900:#0265dc; --n-blue-1000:#0054b6; --n-blue-1100:#004491; --n-focus:#78bbfa;
  --n-green-100:#d1fbe3; --n-green-200:#adf4ce; --n-green-900:#008f5d; --n-green-1000:#007a4d; --n-green-1100:#00653e;
  --n-yellow-100:#fef7cd; --n-yellow-900:#f8d904; --n-yellow-1000:#e8c600; --n-yellow-1100:#d7b300;
  --n-orange-100:#ffeccc; --n-orange-900:#f68511;
  --n-red-100:#ffebe7; --n-red-200:#ffddd6; --n-red-900:#d31510; --n-red-1000:#b40000; --n-red-1100:#930000;
  --n-radius-s:4px; --n-radius-m:8px; --n-radius-l:16px; --n-radius-round:100px;
  --n-space-2xs:4px; --n-space-xs:8px; --n-space-s:16px; --n-space-m:24px; --n-space-xl:40px; --n-space-2xl:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121314;--panel:#1a1b1d;--fg:#ececec;--muted:#9a9ca0;--line:#2b2d30;--accent:#5aa7ff;--accent-soft:#12263d;--code-bg:#202225;--stage:#202225;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121314;--panel:#1a1b1d;--fg:#ececec;--muted:#9a9ca0;--line:#2b2d30;--accent:#5aa7ff;--accent-soft:#12263d;--code-bg:#202225;--stage:#202225;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--panel);padding:20px 12px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;padding:8px 10px 20px}
/* brand mark: a green frame with four navy corner handles, drawn to the proportions of the supplied Group.svg */
.brand__t{position:relative;display:inline-block;margin:5px;padding:10px 14px;border:1px solid #008f5d;font-weight:600;font-size:15px;line-height:1.25;color:var(--fg);white-space:nowrap}
.brand__t i{position:absolute;width:9px;height:9px;box-sizing:border-box;background:var(--panel);border:1px solid #008f5d;display:block}
.brand__t i:nth-child(1){top:-5px;left:-5px}.brand__t i:nth-child(2){top:-5px;right:-5px}.brand__t i:nth-child(3){bottom:-5px;left:-5px}.brand__t i:nth-child(4){bottom:-5px;right:-5px}
.brand__t--sq{display:grid;place-items:center;width:112px;height:112px;padding:0;margin:6px;text-align:center;white-space:normal;font-size:16px}
.topbar .brand__t{padding:6px 12px;font-size:14px}
.group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;font-weight:500}
.nav a{display:block;padding:6px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
.nav a:hover{background:var(--code-bg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.topbar{display:none}
main{min-width:0;padding-block:40px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px}
h1{font-size:32px;line-height:40px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 28px;max-width:none}
@media (min-width:861px){.lede{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:36px 0 12px}
.play{display:grid;grid-template-columns:minmax(0,1fr) 260px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.stage{background:var(--n-neutral-200);min-height:260px;display:flex;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden;min-width:0;color:var(--n-neutral-900);font-family:var(--font)}
.ctrls{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.ctrls label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ctrls label.row{flex-direction:row;align-items:center;justify-content:space-between}
.play--fixed{--h:600px}.play--fixed .stage{height:var(--h);min-height:0;padding-block:16px;align-items:safe center;justify-content:safe center;overflow:auto}.play--fixed .ctrls{max-height:var(--h);overflow-y:auto}
.ip-w{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ip-t{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;color:var(--fg);cursor:pointer;text-align:left;min-width:0}
.ip-t:hover{border-color:var(--muted)}.ip-v{display:flex;align-items:center;gap:8px;min-width:0}.ip-v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ip-t svg,.ip-l svg{width:16px;height:16px;flex:none}
.ip-pop{position:fixed;z-index:60;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #00000029;overflow:hidden;font-size:14px}
.ip-s{padding:8px;border-bottom:1px solid var(--line)}.ip-s input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;color:var(--fg)}
.ip-l{list-style:none;margin:0;padding:4px;max-height:188px;overflow-y:auto}
.ip-l li{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:6px;cursor:pointer;color:var(--fg)}.ip-l li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ip-l li.is-active,.ip-l li:hover{background:var(--code-bg)}.ip-l li[aria-selected=true]{color:var(--accent);font-weight:500}.ip-l .ip-empty{cursor:default;color:var(--muted);justify-content:center}.ip-l .ip-empty:hover{background:none}
.ctl-h{font:500 12px/16px var(--font);color:var(--fg);padding-top:12px;border-top:1px solid var(--line)}
.ctrls select,.ctrls input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;color:var(--fg);min-width:0}
.ctrls input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.codebox{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);overflow:hidden}
.codebox pre{margin:0;padding:16px;overflow-x:auto;font:12.5px/1.6 var(--mono);color:var(--fg)}
.codebox__p{position:relative}.codebox.is-collapsed pre{max-height:272px;overflow-y:hidden}.codebox.is-collapsed .codebox__p::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to bottom,transparent,var(--code-bg));pointer-events:none}
.codebox__bar{display:flex;justify-content:center;padding:8px;border-top:1px solid var(--line)}.codebox__more{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer}.codebox__more:hover{border-color:var(--accent);color:var(--accent)}
.copy{display:inline-flex;align-items:center;gap:6px;position:absolute;z-index:2;top:8px;right:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.copy svg{width:14px;height:14px;flex:none}.copy:hover{border-color:var(--accent);color:var(--accent)}
.matrix{border:1px solid var(--line);border-radius:10px;background:var(--n-neutral-100);overflow-x:auto;color:var(--n-neutral-900);font-family:var(--font)}
.matrix table{border-collapse:collapse;width:100%;min-width:560px}
.matrix th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n-neutral-700);font-weight:500;text-align:left;padding:12px 16px;border-bottom:1px solid var(--n-neutral-300);white-space:nowrap}
.matrix td{padding:14px 16px;border-bottom:1px solid var(--n-neutral-200);vertical-align:middle}
.matrix tr:last-child td{border-bottom:0}
.matrix td.rl{font-size:12px;color:var(--n-neutral-700);white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:70ch}

/* tokens page */
.fam{margin-bottom:22px}
.fam h3{font-size:14px;font-weight:500;margin:0 0 8px;text-transform:capitalize}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.sw button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.sw button:focus-visible{outline:2px solid var(--accent)}
.sw .chip{height:52px;border-bottom:1px solid var(--line)}
.sw .meta{padding:6px 8px;font:11.5px/1.4 var(--mono)}
.sw .meta b{display:block;font:500 12px var(--font)}
.rows{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rows>div{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) minmax(0,auto);gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rows>div:last-child{border-bottom:0}
.rows code{font:12px var(--mono);color:var(--muted)}
.bar{height:12px;background:var(--n-blue-900);border-radius:2px}
.rad{width:56px;height:36px;border:2px solid var(--n-blue-900);background:var(--n-blue-100)}
.toast-copied{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}

/* ===== Norden components ===== */
.nd-btn{--bg-c:var(--n-blue-900);--bg-h:var(--n-blue-1000);--bg-p:var(--n-blue-1100);--bg-f:var(--bg-c);--bg-d:var(--n-blue-200);--fg-c:#fff;--fg-d:#fff;--bd:transparent;--bd-h:var(--bd);--bd-p:var(--bd);--ic:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;border:0;cursor:pointer;font:500 14px/20px var(--font);background:var(--bg-c);color:var(--fg-c);height:40px;padding:0 16px;border-radius:var(--n-radius-s);box-shadow:inset 0 0 0 1px var(--bd);transition:background .12s,box-shadow .12s;white-space:nowrap}
.nd-btn:hover,.nd-btn.is-hover{background:var(--bg-h);box-shadow:inset 0 0 0 1px var(--bd-h)}
.nd-btn:active,.nd-btn.is-pressed{background:var(--bg-p);box-shadow:inset 0 0 0 1px var(--bd-p)}
.nd-btn:focus-visible,.nd-btn.is-focus{outline:0;background:var(--bg-f);box-shadow:inset 0 0 0 1px var(--bd),0 0 0 3px var(--n-focus)}
.nd-btn:disabled{background:var(--bg-d);color:var(--fg-d);cursor:not-allowed;box-shadow:inset 0 0 0 1px var(--bd)}
.nd-btn--l{height:48px;padding:0 24px;font-size:16px;line-height:24px;--ic:20px;gap:8px}
.nd-btn--m{height:40px;padding:0 16px}
.nd-btn--s{height:32px;padding:0 16px}
.nd-btn--xs{height:24px;padding:0 12px;font-size:12px;line-height:16px;--ic:14px;gap:4px}
.nd-btn--icon,.nd-btn--icon.nd-btn--l{padding:0;width:48px}.nd-btn--icon.nd-btn--m{width:40px}.nd-btn--icon.nd-btn--s{width:32px}.nd-btn--icon.nd-btn--xs{width:24px}
.nd-btn--secondary{--bg-c:#fff;--bg-h:var(--n-blue-100);--bg-p:var(--n-blue-200);--bg-f:#fff;--bg-d:#fff;--fg-c:var(--n-blue-900);--fg-d:var(--n-blue-400);--bd:var(--n-neutral-300);--bd-h:var(--n-blue-200);--bd-p:var(--n-blue-200)}
.nd-btn--text{--bg-c:transparent;--bg-h:var(--n-blue-100);--bg-p:var(--n-blue-200);--bg-f:#fff;--bg-d:transparent;--fg-c:var(--n-blue-900);--fg-d:var(--n-blue-400)}
.nd-btn--default{--bg-c:var(--n-neutral-900);--bg-h:var(--n-neutral-1000);--bg-p:var(--n-neutral-1100);--bg-d:var(--n-neutral-200);--fg-d:var(--n-neutral-400)}
.nd-btn--nsec{--bg-c:#fff;--bg-h:var(--n-neutral-200);--bg-p:var(--n-neutral-300);--bg-f:#fff;--bg-d:#fff;--fg-c:var(--n-neutral-900);--fg-d:var(--n-neutral-400);--bd:var(--n-neutral-300)}
.nd-btn--ntert{--bg-c:transparent;--bg-h:var(--n-neutral-200);--bg-p:var(--n-neutral-300);--bg-f:#fff;--bg-d:transparent;--fg-c:var(--n-neutral-900);--fg-d:var(--n-neutral-400)}
.nd-btn--danger{--bg-c:var(--n-red-900);--bg-h:var(--n-red-1000);--bg-p:var(--n-red-1100);--bg-d:var(--n-red-200)}
.nd-btn--dsec{--bg-c:#fff;--bg-h:var(--n-red-100);--bg-p:var(--n-red-200);--bg-f:#fff;--bg-d:#fff;--fg-c:var(--n-red-900);--fg-d:var(--n-red-400);--bd:var(--n-neutral-300);--bd-h:var(--n-red-200);--bd-p:var(--n-red-200)}
.nd-btn--dtert{--bg-c:transparent;--bg-h:var(--n-red-100);--bg-p:var(--n-red-200);--bg-f:#fff;--bg-d:transparent;--fg-c:var(--n-red-900);--fg-d:var(--n-red-400)}
.nd-btn svg{width:var(--ic);height:var(--ic);flex:none}

.nd-field{display:flex;flex-direction:column;gap:6px;width:280px;max-width:100%;font-family:var(--font)}
.nd-label{font:500 14px/20px var(--font);color:var(--n-neutral-900)}
.nd-input{height:40px;padding:0 12px;border:1px solid var(--n-neutral-300);border-radius:var(--n-radius-s);background:#fff;font:400 14px/20px var(--font);color:var(--n-neutral-900);box-shadow:0 1px 2px #29292910;width:100%}
.nd-input::placeholder{color:var(--n-neutral-600)}
.nd-input:hover{border-color:var(--n-neutral-400)}
.nd-input:focus,.nd-input.is-focus{outline:0;border-color:var(--n-blue-900);box-shadow:0 0 0 3px #78bbfa66}
.nd-field--error .nd-input{border-color:var(--n-red-900)}
.nd-field--error .nd-input:focus{box-shadow:0 0 0 3px #d3151033}
.nd-input:disabled{background:var(--n-neutral-200);color:var(--n-neutral-400);cursor:not-allowed;box-shadow:none}
.nd-help{font:400 12px/16px var(--font);color:var(--n-neutral-600)}
.nd-field--error .nd-help{color:var(--n-red-900)}

.nd-check{display:inline-flex;gap:8px;align-items:flex-start;cursor:pointer;font-family:var(--font);position:relative}
.nd-check input{position:absolute;opacity:0;width:24px;height:24px;margin:0}
.nd-check .box{width:24px;height:24px;box-sizing:border-box;border:2px solid var(--n-neutral-300);border-radius:var(--n-radius-s);background:#fff;display:grid;place-items:center;flex:none;color:#fff;transition:background .12s,border-color .12s}
.nd-check .box svg{width:16px;height:16px;opacity:0}
.nd-check input:checked+.box{background:var(--n-blue-900);border-color:var(--n-blue-900)}
.nd-check input:checked+.box svg{opacity:1}
.nd-check:hover .box{border-color:var(--n-blue-900)}
.nd-check input:focus-visible+.box{box-shadow:0 0 0 3px var(--n-focus)}
.nd-check--error .box,.nd-check--error:hover .box{border-color:var(--n-red-900)}
.nd-check--error input:checked+.box{background:var(--n-red-900);border-color:var(--n-red-900)}
.nd-check input:disabled+.box,.nd-check:hover input:disabled+.box{background:var(--n-neutral-200);border-color:var(--n-neutral-300);color:var(--n-neutral-400)}
.nd-check input:disabled:checked+.box{background:var(--n-neutral-200);border-color:var(--n-neutral-300);color:var(--n-neutral-400)}
.nd-check:has(input:disabled){cursor:not-allowed}
.nd-check:has(input:disabled) .t1,.nd-check:has(input:disabled) .t2{color:var(--n-neutral-400)}
.nd-check .t1{display:block;font:400 14px/24px var(--font);color:var(--n-neutral-900)}
.nd-check .t2{display:block;font:400 12px/16px var(--font);color:var(--n-neutral-600)}
.nd-check--error .t2{color:var(--n-red-900)}
.nd-cg{display:inline-flex;flex-direction:column;gap:8px;font-family:var(--font)}
.nd-cg__h{margin-bottom:0}.nd-cg__t{display:block;font:500 16px/24px var(--font);color:var(--n-neutral-900)}.nd-cg__i{display:block;font:400 12px/16px var(--font);color:var(--n-neutral-600)}
.nd-cg--disabled .nd-cg__t,.nd-cg--disabled .nd-cg__i{color:var(--n-neutral-400)}
.nd-cg__e{display:block;font:400 12px/16px var(--font);color:var(--n-red-900)}

.nd-toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-family:var(--font)}
.nd-toggle input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.nd-toggle .track{--w:48px;--h:28px;--i:3px;width:var(--w);height:var(--h);border-radius:var(--n-radius-round);background:var(--n-neutral-200);position:relative;flex:none;transition:background .15s,box-shadow .15s;box-shadow:inset 0 0 0 2px var(--n-neutral-300),0 4px 10px #29292914}
.nd-toggle .track::after{content:"";position:absolute;top:var(--i);left:var(--i);width:calc(var(--h) - 2 * var(--i));height:calc(var(--h) - 2 * var(--i));border-radius:50%;background:#fff;box-shadow:0 1px 3px #29292940;transition:transform .15s}
.nd-toggle input:checked+.track{background:var(--n-green-900);box-shadow:inset 0 0 0 2px var(--n-green-1000),0 4px 10px #29292921}
.nd-toggle input:checked+.track::after{transform:translateX(calc(var(--w) - var(--h)))}
.nd-toggle input:focus-visible+.track{box-shadow:0 0 0 3px var(--n-focus)}
.nd-toggle--l .track{--w:64px;--h:36px}
.nd-toggle--s .track{--w:30px;--h:16px;--i:2px}
.nd-toggle input:disabled+.track{background:var(--n-neutral-200);box-shadow:inset 0 0 0 2px #e6e6e699,0 4px 10px #2929290a}.nd-toggle input:disabled+.track::after{background:#f0f0f0;box-shadow:none}
.nd-toggle input:disabled:checked+.track{background:var(--n-green-200);box-shadow:inset 0 0 0 2px var(--n-green-400),0 4px 10px #29292914}.nd-toggle input:disabled:checked+.track::after{background:#fff;box-shadow:0 1px 3px #29292926}
.nd-toggle:has(input:disabled){cursor:not-allowed}
.nd-toggle:has(input:disabled) .t1,.nd-toggle:has(input:disabled) .t2{color:var(--n-neutral-400)}
.nd-toggle .t1{display:block;font:400 16px/20px var(--font);color:var(--n-neutral-900)}
.nd-toggle .t2{display:block;font:400 14px/20px var(--font);color:var(--n-neutral-600)}



:root{--n-overlay:#002754cc}
.nd-modal{width:512px;max-width:100%;background:#fff;border-radius:var(--n-radius-s);box-shadow:0 8px 24px #29292933;font-family:var(--font);color:var(--n-neutral-900);overflow:hidden;text-align:left}
.nd-modal__h{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 16px;border-bottom:1px solid var(--n-neutral-300)}.nd-modal__t{font:500 16px/24px var(--font);margin:0}.nd-modal__h .nd-x{margin-left:auto}

  [['Brand / Primary','brand.primary','blue'],['Success','success','green'],['Warning','warning','orange'],['Danger','danger','red']].forEach(function(c){var t=tokS('button.'+c[1],c[2],[900,1000,1100,200],TK_S4);
    if(c[1]==='brand.primary')t=t.concat(tokS('button.brand.primary.inverted','neutral',[100,100,100,100],TK_S4).map(function(k,i){return i===1?tokT(k.n,'blue',100):i===2?tokT(k.n,'blue',200):k}));
    if(c[1]==='danger')t=t.concat(tokS('button.danger.inverted','neutral',[100,100,100,100],TK_S4).map(function(k,i){return i===1?tokT(k.n,'red',100):i===2?tokT(k.n,'red',200):k}));
    btn.push({n:c[0],t:t})});
  G.push({g:'Button',s:btn});
  var ico=[{n:'Default',t:tokS('icon.default.primary','neutral',[900,1000,1100,400],TK_S4).concat(tokS('icon.default.secondary','neutral',[600,700,800,400],TK_S4),[tokT('icon.default.inverted-default','neutral',100),tokT('icon.default.inverted-hover','neutral',400)])}];
  TK_COL.forEach(function(c){if(c[1]==='brand.tertiary')return;ico.push({n:c[0],t:tokS('icon.'+c[1],c[2],[900,1000,1100,400],TK_S4)})});
  G.push({g:'Icon',s:ico});
  var bor=[{n:'Default',t:[tokA('border.default-default','#29292929','neutral.25 • 0.16'),tokT('border.default-active','neutral',900),tokT('border.default.inverted-default','neutral',100)]}];
  [['Brand / Primary','brand.primary','blue'],['Brand / Secondary','brand.secondary','purple'],['Success','success','green'],['Warning','warning','orange'],['Danger','danger','red']].forEach(function(c){bor.push({n:c[0],t:[tokT('border.'+c[1]+'-default',c[2],900),tokT('border.'+c[1]+'-active',c[2],1100)]})});
  G.push({g:'Border',s:bor});
  return G;
}
function pageTokens(v){
  var G=tokData(),total=0;G.forEach(function(g){g.s.forEach(function(s){total+=s.t.length})});
  v.innerHTML='<h1>Color tokens</h1><p class="lede">The semantic tokens for text, surfaces, buttons, icons and borders, and the palette color each one points to. Click a token to copy its hex value. '+total+' tokens. Read from your color tokens page, so check the less common ones against the file.</p><div class="tkb"><input class="tkf" id="tk_q" type="search" placeholder="Search tokens, for example button.danger" aria-label="Search tokens"></div><div id="tk_l"></div>';
  function draw(){var q=$('#tk_q').value.trim().toLowerCase(),h='';
    G.forEach(function(g){var sub='';g.s.forEach(function(s){var items=s.t.filter(function(t){return !q||t.n.toLowerCase().indexOf(q)>=0||t.r.toLowerCase().indexOf(q)>=0});if(!items.length)return;
      sub+='<div class="tks"><div class="tks__h"><i class="pill">'+s.n+'</i></div><div class="tkl">'+items.map(function(t){return '<button type="button" class="tk" data-hex="'+t.x+'" title="Copy '+t.x+'"><i style="background:'+t.x+'"></i><span><b>'+t.n+'</b><em>'+t.r+'</em></span></button>'}).join('')+'</div></div>'});
      if(sub)h+='<section class="tkg"><h2>'+g.g+'</h2>'+sub+'</section>'});
    $('#tk_l').innerHTML=h||'<p class="note">No tokens match that search.</p>';
    $$('#tk_l [data-hex]').forEach(function(b){b.addEventListener('click',function(){copy(b.dataset.hex)})})}
  $('#tk_q').addEventListener('input',draw);draw();
}
function pageType(v){
  function row(r,fam){var up=r[5]&1,ul=r[5]&2,mono=r[5]&4,big=r[1]>=88,sz=big?'min('+r[1]+'px,'+(r[1]/160*10.5).toFixed(2)+'vw)':r[1]+'px';
    return '<div class="tyt__r"><div class="tyt__s" style="font:'+r[4]+' '+sz+'/'+r[2]+'px '+(mono?"'Roboto Mono',ui-monospace,monospace":'var(--font)')+(big?';letter-spacing:-.02em':'')+(ul?';text-decoration:underline;text-underline-offset:3px':'')+'">'+r[0]+'</div><div class="tyt__m">'+fam+'</div><div class="tyt__m">'+r[1]+'px</div><div class="tyt__m">'+r[2]+'px</div><div class="tyt__m">'+r[3]+'</div></div>'}
  function sec(title,pill,groups){var h='<section class="tys"><div class="pal__h"><b style="font-size:20px">'+title+'</b><i class="pill">'+pill+'</i></div>';
    groups.forEach(function(g){h+='<div class="tyt"><div class="tyt__h"><div>'+g.g+'</div><div>Family</div><div>Size</div><div>Line height</div><div>Weight</div></div>'+g.rows.map(function(r){return row(r,g.f)}).join('')+'</div>'});return h+'</section>'}
  v.innerHTML='<h1>Typography</h1><p class="lede">Inter is the primary font and Roboto Mono the secondary font. Every style in the system, with its size, line height and weight.</p>'+sec('Inter','Primary font',TYPO.filter(function(g){return g.f==='Inter'}))+sec('Roboto Mono','Secondary font',TYPO.filter(function(g){return g.f!=='Inter'}));
}
function icoSVG(n,size){var sw=+(2*24/size).toFixed(2);return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+FEATHER[n]+'</svg>'}
function pageIcons(v){
  var names=Object.keys(FEATHER).sort();
  v.innerHTML='<h1>Icons</h1><p class="lede">The Norden icon set is Feather, an open source icon set (MIT license). '+names.length+' icons in three sizes: Large (24 px), Medium (20 px) and Small (16 px). All icons use a 2 px stroke. Click an icon to copy its SVG.</p><div class="icbar"><label>Size<span class="icsel"><select id="ic_size"><option value="24">Large, 24 px</option><option value="20">Medium, 20 px</option><option value="16">Small, 16 px</option></select>'+fsvg('chevron-down')+'</span></label><label>Search<input id="ic_q" type="search" placeholder="Search icons"></label><span id="ic_n" class="note" style="margin:0 0 8px"></span></div><div class="pal__h"><b style="font-size:20px" id="ic_t">Large</b><i class="pill" id="ic_p">24px</i></div><div class="icg" id="ic_g"></div>';
  function draw(){var size=$('#ic_size').value,q=$('#ic_q').value.trim().toLowerCase(),list=names.filter(function(n){return !q||n.indexOf(q)>=0});
    $('#ic_t').textContent={24:'Large',20:'Medium',16:'Small'}[size];$('#ic_p').textContent=size+'px';$('#ic_n').textContent=list.length+' of '+names.length+' icons';
    $('#ic_g').innerHTML=list.map(function(n){return '<button type="button" class="ic" data-n="'+n+'" title="Copy the SVG for '+n+'">'+icoSVG(n,size)+'<small>'+n+'</small></button>'}).join('')||'<p class="note">No icons match that search.</p>';
    $$('#ic_g .ic').forEach(function(b){b.addEventListener('click',function(){copy(icoSVG(b.dataset.n,size))})})}
  ['ic_size'].forEach(function(id){$('#'+id).addEventListener('change',draw)});$('#ic_q').addEventListener('input',draw);draw();
}
function pageSpace(v){
  function sec(t,list,vis,grp){return '<section class="nm"><h2>'+t+'</h2>'+list.map(function(x){return '<div class="nm__r"><div class="nm__v">'+vis(x[1])+'</div><button type="button" class="nm__t" data-tok="'+x[1]+'" title="Copy the value"><b>'+x[1]+'</b> \u2022 number/'+grp+'/'+x[0].split('-')[1]+'</button></div>'}).join('')+'</section>'}
  v.innerHTML='<h1>Numeric system</h1><p class="lede">The numeric values and token properties for Spacing, Radius and Component measurements. Click a token to copy its value.</p><div class="nmg">'+
    sec('Spacing',SPACING,function(n){return '<i class="nm__sp" style="width:'+n*0.6+'px"></i>'},'spacing')+
    sec('Radius',RADIUS,function(n){return '<i class="nm__ra" style="border-radius:'+n+'px"></i>'},'radius')+
    sec('Component',COMPONENT,function(n){return '<i class="nm__co" style="height:'+n+'px"></i>'},'component')+'</div>';
  $$('[data-tok]').forEach(function(b){b.addEventListener('click',function(){copy(b.dataset.tok)})});
}

/* Searchable icon picker for the controls panel: a trigger, a search box and a list that shows five icons at a time. */
function iconPicker(x){
  var id='c_'+x.k,w=document.createElement('div');w.className='ip-w';
  var names=Object.keys(FEATHER).sort();
  w.innerHTML='<span id="'+id+'-l">'+esc(x.l)+'</span><input type="hidden" id="'+id+'" value="'+esc(x.d)+'"><button type="button" class="ip-t" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="'+id+'-l '+id+'-v"><span class="ip-v" id="'+id+'-v"></span>'+I.chev+'</button>';
  var inp=$('input',w),t=$('.ip-t',w),v=$('.ip-v',w),pop=null,list=null,q='',act=0,shown=[];
  function paintV(){v.innerHTML=fsvg(inp.value)+'<span>'+esc(inp.value)+'</span>'}
  paintV();
  function onScroll(e){if(pop&&pop.contains(e.target))return;close()}
  function outside(e){if(pop&&!pop.contains(e.target)&&!t.contains(e.target))close()}
  function close(){if(!pop)return;pop.remove();pop=null;t.setAttribute('aria-expanded','false');document.removeEventListener('mousedown',outside,true);window.removeEventListener('resize',close);window.removeEventListener('scroll',onScroll,true);window.removeEventListener('hashchange',close)}
  function choose(n){inp.value=n;paintV();close();t.focus();inp.dispatchEvent(new Event('input',{bubbles:true}))}
  function fill(keepScroll){
    shown=names.filter(function(n){return !q||n.indexOf(q)>-1});
    if(act>=shown.length)act=Math.max(0,shown.length-1);
    list.innerHTML=shown.length?shown.map(function(n,i){return '<li role="option" data-n="'+n+'" aria-selected="'+(n===inp.value)+'"'+(i===act?' class="is-active"':'')+'>'+fsvg(n)+'<span>'+n+'</span></li>'}).join(''):'<li class="ip-empty" role="presentation">No icons found</li>';
    if(!keepScroll){var s=list.querySelector('[aria-selected="true"]');list.scrollTop=s?Math.max(0,s.offsetTop-72):0}
  }
  function mark(){var items=list.querySelectorAll('li[data-n]');items.forEach(function(li,i){li.classList.toggle('is-active',i===act)});var a=items[act];if(a){if(a.offsetTop<list.scrollTop)list.scrollTop=a.offsetTop;else if(a.offsetTop+a.offsetHeight>list.scrollTop+list.clientHeight)list.scrollTop=a.offsetTop+a.offsetHeight-list.clientHeight}}
  function open(){
    if(pop)return;q='';act=Math.max(0,names.indexOf(inp.value));
    pop=document.createElement('div');pop.className='ip-pop';
    pop.innerHTML='<div class="ip-s"><input type="search" placeholder="Search icons" aria-label="Search icons" autocomplete="off"></div><ul class="ip-l" role="listbox" aria-label="Icons"></ul>';
    list=$('.ip-l',pop);document.body.appendChild(pop);t.setAttribute('aria-expanded','true');
    var r=t.getBoundingClientRect();pop.style.width=Math.max(r.width,220)+'px';pop.style.left=Math.min(r.left,window.innerWidth-pop.offsetWidth-8)+'px';
    fill(false);act=Math.max(0,shown.indexOf(inp.value));mark();
    var h=pop.offsetHeight;pop.style.top=((window.innerHeight-r.bottom<h+12&&r.top>h+12)?r.top-h-4:r.bottom+4)+'px';
    var s=$('input',pop);s.focus();
    s.addEventListener('input',function(){q=s.value.trim().toLowerCase();act=0;fill(true);list.scrollTop=0});
    s.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){e.preventDefault();if(shown.length){act=(act+1)%shown.length;mark()}}
      else if(e.key==='ArrowUp'){e.preventDefault();if(shown.length){act=(act-1+shown.length)%shown.length;mark()}}
      else if(e.key==='Enter'){e.preventDefault();if(shown[act])choose(shown[act])}
      else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();close();t.focus()}});
    list.addEventListener('mousedown',function(e){e.preventDefault()});
    list.addEventListener('click',function(e){var li=e.target.closest('li[data-n]');if(li)choose(li.dataset.n)});
    document.addEventListener('mousedown',outside,true);window.addEventListener('resize',close);window.addEventListener('scroll',onScroll,true);window.addEventListener('hashchange',close)}
  t.addEventListener('click',function(){pop?close():open()});
  t.addEventListener('keydown',function(e){if(e.key==='ArrowDown'&&!pop){e.preventDefault();open()}});
  return w}
function pageComponent(v,key){
  var c=C[key],P={};if(c.reset)c.reset();c.controls.forEach(function(x){P[x.k]=x.d});

  function mtx(m){return '<div class="matrix"><table><thead><tr><th></th>'+m.cols.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+m.rows.map(function(r){return '<tr><td class="rl">'+r.label+'</td>'+r.cells.map(function(cell){return '<td>'+cell+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
  v.innerHTML=srcBadge(c)+'<h1>'+c.title+'</h1><p class="lede">'+c.desc+'</p><h2>Interactive preview</h2>'+
    '<div class="play play--fixed"><div class="stage" id="stage"></div><div class="ctrls" id="ctrls"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Properties</div></div></div>'+
    '<h2>Code</h2><div id="code"></div>';
  var stage=$('#stage'),ctrls=$('#ctrls');
  c.controls.forEach(function(x){
    if(x.t==='icon'){var ipw=iconPicker(x);x._l=ipw;ctrls.appendChild(ipw);return}
    if(x.t==='head'){var hd=document.createElement('div');hd.className='ctl-h';hd.textContent=x.l;x._l=hd;ctrls.appendChild(hd);return}
    var id='c_'+x.k,l=document.createElement('label');l.htmlFor=id;
    if(x.t==='select'){l.innerHTML='<span>'+x.l+'</span><select id="'+id+'">'+x.o.map(function(o){return '<option'+(o===x.d?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}
    else if(x.t==='text'){l.innerHTML='<span>'+x.l+'</span><input type="text" id="'+id+'" value="'+esc(x.d)+'">'}
    else if(x.t==='num'){l.innerHTML='<span>'+x.l+'</span><input type="text" id="'+id+'" value="'+esc(x.d)+'" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" data-num>'}
    else{l.className='row';l.innerHTML='<span>'+x.l+'</span><input type="checkbox" id="'+id+'"'+(x.d?' checked':'')+'>'}
    x._l=l;ctrls.appendChild(l);
  });
  function read(){c.controls.forEach(function(x){if(x.t==='head')return;var el=$('#c_'+x.k);P[x.k]=x.t==='bool'?el.checked:el.value});return P}
  var last='';
  function draw(){
    read();last=JSON.stringify(P);c.controls.forEach(function(x){if(x.show&&x._l)x._l.hidden=!x.show(P)});stage.innerHTML=c.render(P);
    if(c.bind)c.bind(stage,Object.assign({},P),function(){return read()});
    var snippet=indent(c.codeOf?c.codeOf(P):c.render(P));
    $('#code').innerHTML=codeBox(snippet);
    wireCopy($('#code'),function(){return snippet});
  }
  ctrls.addEventListener('input',function(e){var t=e.target;if(t&&t.hasAttribute&&t.hasAttribute('data-num')){var v2=t.value.replace(/\D/g,'').slice(0,2);if(v2!==t.value)t.value=v2}});
  ctrls.addEventListener('input',draw);ctrls.addEventListener('change',function(){if(JSON.stringify(read())!==last)draw()});
  draw();
  if(false){ /* make static matrix cells interactive where it makes sense */
    $$('.matrix',v).forEach(function(m){c.bind(m,P,function(){return P})});
  }
}

function route(){
  CODE_OPEN=false;
  var h=(location.hash||'').replace('#','')||'alert',v=$('#view');
  buildNav(h);$('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');
  if(h==='colors')pageColors(v);else if(h==='color-tokens')pageTokens(v);else if(h==='typography')pageType(v);else if(h==='spacing')pageSpace(v);else if(h==='icons')pageIcons(v);
  else if(KEY[h])pageComponent(v,KEY[h]);else{location.hash='#alert';return}
  document.title='Norden Design System';
  window.scrollTo(0,0);
}
$('#menuBtn').addEventListener('click',function(){var s=$('#side'),o=s.classList.toggle('open');this.setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);
route();
})();
